version: 2

models:
  - name: stg_customers
    description: 'Staged customer data sourced from the raw customers training table,
      containing core customer attributes. This model renames the raw `id` field to
      `customer_id` and selects `first_name` and `last_name` for downstream use. Note:
      this model is tagged as PII as it contains personally identifiable customer information.'
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: Staging table that cleans and renames fields from the raw orders source.
      This model contains order-level data including the order ID, customer ID, order
      date, and order status, serving as the foundational layer for downstream finance
      and sales analytics.
    meta:
      owner: "@sales-team"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: Staged payment records sourced from the raw payments training data.
      Each row represents a single payment associated with an order, including the
      payment method used. Monetary amounts have been converted from cents to dollars.
    meta:
      owner: "@finance-team"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: Staging model that contains customer signup information sourced from
      the raw signups training data. Fields are renamed for consistency, mapping user
      identifiers and emails to customer-level fields. This table includes PII such
      as customer email and hashed password, along with the signup date for each customer.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
