version: 2

models:
  - name: stg_customers
    description: "Staging layer for customer data that standardizes raw customer information by renaming columns and switching between validation and training datasets based on configuration. Provides clean customer identifiers and basic profile information."
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: "Staging layer for order data that cleanses and standardizes raw order information. Renames columns for consistency and switches between validation and training datasets based on environment configuration. Contains order status, timing, and customer relationships."
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values:
                ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set:
                ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: "Staging layer for payment data that processes raw payment information and converts monetary amounts from cents to dollars. Provides clean payment identifiers, methods, and standardized amount formatting for downstream financial calculations."
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: "Staging layer for user signup data that cleanses and standardizes raw signup information. Renames columns for consistency, handles customer email uniqueness, and switches between validation and training datasets based on configuration. Contains signup timing and customer registration details."
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
