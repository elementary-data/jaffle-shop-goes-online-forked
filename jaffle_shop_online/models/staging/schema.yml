version: 2

models:
  - name: stg_customers
    description: This staging model provides a clean, standardized view of customer
      data from the raw customer training dataset. It serves as the foundational layer
      for customer analytics and reporting by ensuring consistent field naming and
      structure. The model performs basic transformations including renaming the customer
      ID field and selecting core customer attributes like first and last names.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model standardizes raw order data by cleaning column
      names and selecting core order attributes. It serves as the foundation for downstream
      finance and sales analytics by providing a consistent view of customer orders.
      The model renames key identifiers (id to order_id, user_id to customer_id) and
      preserves essential order information including order date and status for further
      analysis.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model contains cleaned and standardized payment transaction
      data from the raw payments source. It serves as the foundation for financial
      reporting and payment analysis by providing a consistent view of all payment
      transactions. The model renames fields for clarity and converts payment amounts
      from cents to dollars for easier business consumption.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model cleans and standardizes raw customer signup data
      from the source system. It serves as the foundation for analyzing user acquisition
      patterns, signup trends, and customer onboarding metrics across the business.
      The model renames columns to follow consistent naming conventions, mapping user
      identifiers to customer identifiers and standardizing field names for downstream
      analysis.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
