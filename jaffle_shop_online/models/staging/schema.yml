version: 2

models:
  - name: stg_customers
    description: This staging model contains cleaned and standardized customer data
      from the raw customers source table. It serves as the foundation for customer
      analytics and reporting by providing a consistent view of customer information
      across the organization. The model renames the primary key from 'id' to 'customer_id'
      and selects essential customer attributes including first name and last name
      for downstream analysis.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model cleans and standardizes raw order data from the
      source system, serving as the foundation for downstream sales and finance analytics.
      The model renames key fields for consistency, transforming `id` to `order_id`
      and `user_id` to `customer_id` while preserving order date and status information.
      Each row represents a single customer order with standardized column names ready
      for use in business reporting and analysis.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model transforms raw payment data into a clean, analysis-ready
      format for downstream analytics and reporting. It standardizes payment information
      including payment methods and monetary amounts to support financial analysis
      and order tracking. The model converts payment amounts from cents to dollars
      for easier interpretation and renames fields to follow consistent naming conventions
      across the data warehouse.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model contains standardized customer signup data from
      the raw signups source table. It serves as the foundation for analyzing user
      registration patterns, tracking customer acquisition, and supporting downstream
      analytics workflows. The model performs basic transformations including renaming
      columns for consistency (id to signup_id, user_id to customer_id, user_email
      to customer_email) and maintains critical signup information such as customer
      emails, hashed passwords, and signup dates.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
