version: 2

models:
  - name: stg_customers
    description: This staging model provides a cleaned and standardized view of customer
      data from the raw customer training dataset. It serves as the foundational layer
      for customer analytics and reporting by ensuring consistent customer identification
      and naming conventions. The model performs basic transformations including renaming
      the id column to customer_id for clarity and selecting essential customer attributes
      like first and last names.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model contains cleaned and standardized order data from
      the raw orders source table. It serves as the foundation for finance and sales
      reporting by providing a consistent view of customer orders, their status, and
      transaction dates. The model performs basic transformations including renaming
      columns for clarity (id to order_id, user_id to customer_id) and selecting only
      the essential order attributes needed for downstream analysis.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging table contains cleaned and standardized payment transaction
      data from the raw payments source. It serves as the foundation for financial
      reporting and payment analysis by providing a consistent view of all payment
      transactions. The model performs key transformations including renaming the
      ID field to payment_id for clarity and converting payment amounts from cents
      to dollars for easier business use.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model contains cleaned and standardized customer signup
      data from the raw signups source. It serves as the foundation for analyzing
      user registration patterns, tracking signup metrics, and supporting customer
      acquisition reporting. The model renames columns for consistency across the
      data warehouse and includes personally identifiable information such as customer
      email addresses and hashed passwords.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
