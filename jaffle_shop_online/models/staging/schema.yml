version: 2

models:
  - name: stg_customers
    description: This staging model contains cleaned and standardized customer data
      from the raw customers training dataset. It serves as the foundation for customer
      analytics and reporting by providing a reliable source of customer information
      with consistent naming conventions. The model renames the primary key from 'id'
      to 'customer_id' and preserves customer first and last names for downstream
      analysis.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model contains cleaned and standardized order data from
      the raw orders source table. It serves as the foundation for finance and sales
      analytics by providing a consistent view of customer orders and their current
      status. The model renames key fields for clarity, mapping the source `id` to
      `order_id` and `user_id` to `customer_id`, while preserving order dates and
      status information.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model cleans and standardizes raw payment data from
      the e-commerce system, providing a foundation for downstream financial analysis
      and reporting. Each row represents a single payment transaction with details
      about the payment method, associated order, and transaction amount. The model
      converts payment amounts from cents to dollars for easier analysis and renames
      fields to follow consistent naming conventions across the data warehouse.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model contains cleaned and standardized customer signup
      data from the raw signups source. It serves as the foundation for analyzing
      user acquisition patterns and tracking customer registration metrics across
      the business. The model renames columns to follow consistent naming conventions,
      converting user identifiers to customer identifiers and ensuring field names
      align with downstream analytics requirements.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
