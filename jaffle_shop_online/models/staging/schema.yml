version: 2

models:
  - name: stg_customers
    description: This staging model provides a clean, standardized view of customer
      data from the raw customers table. It serves as the foundation for downstream
      customer analytics and reporting by ensuring consistent data structure and naming
      conventions. The model renames the raw ID field to customer_id and selects essential
      customer identifiers including first and last names.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model standardizes raw order data by cleaning and renaming
      columns for consistent use across the analytics pipeline. It serves as the foundation
      for sales and finance reporting by providing a reliable source of order information
      including customer relationships and order status tracking. The model transforms
      raw column names to business-friendly names, mapping user_id to customer_id
      and id to order_id for clarity.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model cleans and standardizes raw payment data from
      the source system, providing a foundation for downstream financial analysis
      and reporting. The model transforms payment amounts from cents to dollars for
      easier business consumption and renames fields to follow consistent naming conventions.
      Each row represents a single payment transaction with details including payment
      method, associated order, and monetary amount.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model processes raw customer signup data and standardizes
      it for downstream analytics use. It serves as the foundation for analyzing customer
      acquisition patterns and tracking user registration metrics across the business.
      The model renames key fields for consistency, converting raw identifiers to
      business-friendly names like signup_id and customer_id while preserving essential
      signup information including customer email and registration dates.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
