version: 2

models:
  - name: stg_customers
    description: This staging model contains basic customer information including unique
      customer identifiers and personal details. It serves as the foundational layer
      for customer analytics and reporting across the organization. The model standardizes
      the raw customer data by renaming the ID field to customer_id for consistency
      with downstream models.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: 'This staging model contains cleaned and standardized order data from
      the raw orders source table. It serves as the foundation for downstream analytics
      by providing consistent column naming and data structure for order analysis across
      finance and sales reporting. '
    meta:
      owner: "@sales-team"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging table contains standardized payment data from the raw
      payments source, with each row representing a single payment transaction. It
      serves as a cleaned foundation for downstream financial analysis and reporting
      by the finance team. The model renames the payment ID field for clarity and converts
      payment amounts from cents to dollars for easier business use.
    meta:
      owner: "@finance-team"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This table contains customer signup information including signup identifiers,
      customer details, and registration dates. It serves as the foundational dataset
      for analyzing customer acquisition patterns and onboarding processes. The model
      standardizes column names from the raw signup data, renaming user fields to customer
      fields for consistency across the data warehouse.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
