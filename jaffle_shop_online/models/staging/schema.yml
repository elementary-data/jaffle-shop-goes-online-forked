version: 2

models:
  - name: stg_customers
    description: This staging model transforms raw customer data into a simplified
      format by renaming fields for consistency across the data platform. It extracts
      customer identifiers along with their first and last names from the raw data
      source, providing a clean foundation for customer analysis. The model contains
      PII data and serves as an intermediate step in the customer data processing
      pipeline.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model transforms raw order data from the jaffle_shop
      database. It represents cleaned order information with renamed columns for better
      clarity, including order_id, customer_id, order_date, and status. This model
      serves as a foundation for downstream finance and sales analytics, providing
      standardized order data for reporting and analysis purposes.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model standardizes payment data from the raw payments
      validation table. It represents individual payment records with cleaned and
      transformed attributes, including payment identification, order details, and
      payment methods. The model converts payment amounts from cents to dollars to
      ensure consistent financial reporting across the organization.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
