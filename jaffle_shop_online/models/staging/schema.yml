version: 2

models:
  - name: stg_customers
    description: This staging model provides a clean, standardized view of customer
      data from the raw customer training dataset. It serves as the foundation for
      downstream customer analytics and reporting by ensuring consistent customer
      identification and naming conventions. The model performs basic transformations
      including renaming the customer ID field and selecting essential customer attributes
      like first and last names.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model contains cleaned and standardized order data from
      the raw orders source table. It serves as the foundation for sales and finance
      analytics by providing a consistent view of customer orders and their current
      status. The model performs basic transformations including renaming columns
      for clarity (id to order_id, user_id to customer_id) and maintains essential
      order information such as order date and status.
    meta:
      owner: "@sales-team"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model standardizes raw payment data from the source
      system, preparing it for downstream analysis and reporting. It serves as the
      foundation for financial analytics, enabling the finance team to analyze payment
      patterns, transaction volumes, and revenue metrics. The model converts payment
      amounts from cents to dollars and renames columns to follow consistent naming
      conventions across the data warehouse.
    meta:
      owner: "@finance-team"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
