version: 2

models:
  - name: stg_customers
    description: This staging model contains cleaned and standardized customer data
      from the raw customer source table. It serves as the foundation for customer
      analytics and reporting by providing a consistent view of customer identities.
      The model renames the primary key from 'id' to 'customer_id' for clarity and
      selects essential customer attributes including first name and last name.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model contains cleaned and standardized order data from
      the raw orders source table. It serves as the foundation for sales and finance
      analytics by providing a consistent view of customer orders with proper column
      naming conventions. The model renames key fields for clarity, transforming `id`
      to `order_id` and `user_id` to `customer_id`, while preserving essential order
      information including order date and status.
    meta:
      owner: "@sales-team"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model contains cleaned and standardized payment transaction
      data from the raw payments source. It serves as the foundation for financial
      reporting and payment analysis by providing a consistent view of all payment
      transactions. The model converts payment amounts from cents to dollars and renames
      columns to follow consistent naming conventions across the data warehouse.
    meta:
      owner: "@finance-team"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model contains cleaned and standardized customer signup
      data from the raw signups source. It serves as the foundation for analyzing
      user acquisition patterns, signup trends, and customer onboarding metrics across
      the business. The model renames columns to follow consistent naming conventions,
      converting user identifiers to customer identifiers and standardizing field
      names for downstream consumption.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
