version: 2

models:
  - name: stg_customers
    description: 'This staging model contains cleaned and standardized customer data
      from the raw customer source table. It serves as the foundation for customer
      analytics and reporting by providing a consistent view of customer information
      across the organization. '
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: The model transforms raw column names (id, user_id) to more descriptive
      business names (order_id, customer_id) while preserving essential order information
      including dates and status.
    meta:
      owner: "@sales-team"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model standardizes payment transaction data from the
      raw payments source table for use in downstream analytics. It serves as the foundational
      layer for finance team analysis of payment methods, transaction volumes, and
      revenue tracking. The model converts payment amounts from cents to dollars and
      renames key fields to follow consistent naming conventions across the data warehouse.
    meta:
      owner: "@finance-team"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model contains customer signup data with standardized
      column names and data types from the raw signups source. It serves as the foundation
      for analyzing customer acquisition patterns, signup trends, and user registration
      metrics across the business. The model renames key fields for consistency, mapping
      user_id to customer_id and user_email to customer_email, while preserving essential
      signup information including hashed passwords and signup dates.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
