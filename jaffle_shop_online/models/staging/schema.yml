version: 2

models:
  - name: stg_customers
    description: This staging model provides a cleaned and standardized view of customer
      data from the raw customers table. It serves as the foundational layer for customer
      analytics and reporting across the organization. The model renames the primary
      key from 'id' to 'customer_id' for consistency and selects core customer attributes
      including first name and last name.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model standardizes raw order data by cleaning column
      names and selecting core order attributes. It serves as the foundation for downstream
      finance and sales analytics by providing a consistent view of customer orders.
      The model renames key fields for clarity, converting `id` to `order_id` and
      `user_id` to `customer_id`, while preserving essential order information including
      order date and status.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model standardizes raw payment data from the source
      system, providing a clean foundation for downstream financial analysis. It serves
      as the primary source of payment transaction information for revenue reporting,
      order analysis, and financial reconciliation processes. The model converts payment
      amounts from cents to dollars and renames columns to follow consistent naming
      conventions across the data warehouse.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model contains cleaned and standardized customer signup
      data from the raw signups source. It serves as the foundation for analyzing
      customer acquisition patterns, signup trends, and user registration metrics
      across the business. The model performs basic transformations including renaming
      columns for consistency (id to signup_id, user_id to customer_id, user_email
      to customer_email) and maintains personally identifiable information such as
      customer emails and hashed passwords for authentication purposes.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
