version: 2

models:
  - name: stg_customers
    description: Staging model that contains basic customer information from the raw
      customer data source. This model provides cleaned and renamed customer attributes
      including unique customer identifiers, first names, and last names. Serves as
      the foundational layer for downstream customer analytics and is tagged as containing
      PII data.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: Staging model that standardizes raw order data from the source system.
      It renames columns to follow consistent naming conventions (id to order_id, user_id
      to customer_id) and selects core order attributes including order date and status.
      This model serves as the foundation for downstream sales and finance analytics.
    meta:
      owner: "@sales-team"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: Staging model for payment data that prepares raw payment information
      for downstream analytics. This model provides cleaned payment records with standardized
      fields including payment method, associated order, and payment amount. The amount
      field is converted from cents to dollars for easier analysis and reporting.
    meta:
      owner: "@finance-team"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
