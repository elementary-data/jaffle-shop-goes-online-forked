version: 2

models:
  - name: stg_customers
    description: >
      Standardized customer dimension table that consolidates customer information from raw data sources.
      This model handles both training and validation datasets based on environment configuration.
      Contains personally identifiable information (PII) and is subject to data privacy regulations.
      Key transformations include renaming 'id' to 'customer_id' for consistency across the data model.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: >
      Standardized orders fact table that tracks the complete order lifecycle from placement to completion.
      This staging model provides the foundation for order analytics, revenue reporting, and customer behavior analysis.
      Includes order status validation and supports both training and validation datasets.
      The order_date column enables time-series analysis and freshness monitoring.
    meta:
      owner: "@sales-team"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values:
                ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set:
                ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: >
      Standardized payments fact table that processes financial transaction data with proper currency conversion.
      This model converts payment amounts from cents to dollars for consistent financial reporting.
      Supports multiple payment methods and integrates with order data for revenue attribution.
      Critical for financial reporting, reconciliation, and payment method performance analysis.
    meta:
      owner: "@finance-team"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: >
      Standardized user registration data that tracks customer acquisition and signup patterns.
      This model contains sensitive personally identifiable information (PII) including email addresses and hashed passwords.
      Enables customer acquisition analysis, signup funnel optimization, and user lifecycle tracking.
      The signup_date column supports cohort analysis and customer acquisition cost calculations.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count