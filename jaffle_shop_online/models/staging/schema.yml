version: 2

models:
  - name: stg_customers
    description: "Standardized customer data with cleaned field names and environment-specific sourcing. Uses validation data in validation mode, otherwise uses training data. Transforms raw customer records into a consistent format for downstream models."
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: "Cleaned and standardized order data with renamed fields and consistent structure. Dynamically sources from validation or training datasets based on configuration. Provides the foundation for all order-related analytics and transforms raw order IDs and user references into standardized customer and order identifiers."
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values:
                ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set:
                ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: "Processed payment data with standardized field names and currency conversion. Converts payment amounts from cents to dollars for easier analysis and reporting. Sources from validation or training datasets based on environment configuration."
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: "Cleaned customer signup data with standardized field naming and structure. Transforms raw signup records into consistent format with proper field mapping (user_id to customer_id, user_email to customer_email). Uses environment-specific data sourcing for validation or training purposes."
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
