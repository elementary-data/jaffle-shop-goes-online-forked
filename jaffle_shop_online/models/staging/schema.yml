version: 2

models:
  - name: stg_customers
    description: This staging model contains basic customer information from the raw
      customer data source. It provides a clean, renamed version of customer records
      with standardized column names for downstream analysis and reporting. The model
      performs simple field renaming, transforming the raw `id` field to `customer_id`
      while preserving first and last name attributes.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model contains cleaned and standardized order data from
      the raw orders source. It provides a foundational view of order transactions,
      including order identifiers, associated customers, order dates, and order status.
      The model performs basic transformations by renaming columns to follow consistent
      naming conventions (e.g., `id` to `order_id`, `user_id` to `customer_id`) for
      easier downstream consumption by sales and finance analytics.
    meta:
      owner: "@sales-team"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model contains cleaned and standardized payment transaction
      data from the raw payments source. It serves as the foundation for financial
      reporting and order analytics by providing payment-level details including payment
      method and transaction amounts. The model renames fields for consistency and
      converts payment amounts from cents to dollars for easier analysis.
    meta:
      owner: "@finance-team"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model contains customer signup information, including
      unique signup identifiers, customer details, and registration dates. It serves
      as the foundation for analyzing customer acquisition and registration patterns.
      The model renames fields from the raw signup data for consistency and clarity,
      standardizing column names like `id` to `signup_id` and `user_id` to `customer_id`.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
