version: 2

models:
  - name: stg_customers
    description: This staging model provides a cleaned and standardized view of customer
      data from the raw customer training dataset. It serves as the foundation for
      downstream analytics and reporting by ensuring customer information is properly
      formatted and accessible. The model renames the customer ID field for consistency
      and selects essential customer attributes including first name and last name.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model contains cleaned and standardized order data from
      the raw orders source table. It serves as the foundation for sales and finance
      analytics by providing a consistent view of customer orders and their current
      status. The model renames key fields for clarity, mapping the raw `id` to `order_id`
      and `user_id` to `customer_id` while preserving order dates and status information.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model processes raw payment data from the jaffle shop,
      cleaning and standardizing payment transactions for downstream analytics. It
      serves as the foundation for financial reporting and order analysis by providing
      reliable payment information. The model converts payment amounts from cents
      to dollars and renames columns to follow consistent naming conventions across
      the data warehouse.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model standardizes and cleans raw customer signup data
      from the source system, providing a foundation for downstream analytics and
      customer analysis. The model serves to track customer registration activity
      and provides essential customer identification and authentication details for
      user management and marketing analysis. Key transformations include renaming
      columns for consistency (id to signup_id, user_id to customer_id, user_email
      to customer_email) and maintaining signup timestamps and hashed passwords for
      security compliance.
    meta:
      owner: "Idan"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
