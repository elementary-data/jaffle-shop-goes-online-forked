version: 2

models:
  - name: stg_customers
    description: This staging model provides a cleaned and standardized view of raw
      customer data from the training dataset. It serves as the foundation for downstream
      customer analytics and reporting by ensuring consistent customer identification
      and naming conventions. The model performs basic transformations including renaming
      the primary key from 'id' to 'customer_id' and selecting essential customer
      attributes like first and last names.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
    columns:
      - name: customer_id
        tests:
          - unique:
              config:
                severity: warn
          - relationships:
              to: ref('stg_signups')
              field: customer_id

  - name: stg_orders
    description: This staging model contains cleaned and standardized order data from
      the raw orders source table. It serves as the foundation for sales and finance
      analysis by providing a consistent view of customer orders with proper column
      naming conventions. The model renames key fields for consistency (id to order_id,
      user_id to customer_id) and includes essential order information such as order
      date and status.
    meta:
      owner: "@sales-team"
    config:
      tags: ["staging", "finance", "sales"]
      elementary:
        timestamp_column: "order_date"
    columns:
      - name: order_id
        tests:
          - unique:
              config:
                severity: warn
      - name: status
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["placed", "shipped", "completed", "return_pending", "returned"]
              quote_values: true

  - name: stg_payments
    description: This staging model provides cleaned and standardized payment transaction
      data from the raw payments source. It serves as the foundation for financial
      reporting and analysis by ensuring payment data is properly formatted and ready
      for downstream consumption. The model converts payment amounts from cents to
      dollars and standardizes column names, with each row representing a single payment
      transaction linked to an order.
    meta:
      owner: "@finance-team"
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
        tests:
          - unique:
              config:
                severity: warn
      - name: payment_method
        tests:
          - accepted_values:
              config:
                severity: warn
              values: ["credit_card", "coupon", "bank_transfer", "gift_card"]

  - name: stg_signups
    description: This staging model standardizes customer signup data from the raw
      signups source, providing a clean foundation for downstream analysis. The model
      serves as the primary source for tracking customer acquisition metrics and signup
      patterns across the business. Key transformations include renaming columns for
      consistency (id to signup_id, user_id to customer_id, user_email to customer_email)
      and structuring the data with essential signup attributes including customer
      identification, email addresses, hashed passwords, and signup dates.
    meta:
      owner: "@customer-team"
    config:
      tags: ["staging", "pii"]
      elementary:
        timestamp_column: "signup_date"
    columns:
      - name: signup_id
        tests:
          - unique:
              config:
                severity: warn
      - name: customer_email
        tests:
          - unique
          - elementary.column_anomalies:
              sensitivity: 2
              config:
                severity: warn
              column_anomalies:
                - missing_count
