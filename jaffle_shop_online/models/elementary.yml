models:
  - name: stg_facebook_ads
    data_tests:
      - dbt_utils.equal_column_subset:
          arguments:
            compare_model: source('ads', 'stg_facebook_ads')
            include:
              - ad_id
              - cost
              - date
              - utm_campain
              - utm_medium
          config:
            tags:
              - data_contract
            severity: warn
