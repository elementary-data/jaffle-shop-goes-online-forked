version: 2

sources:
  - name: elementary
    schema: jaffle_shop_elementary
    tables:
      - name: elementary_exposures
        description: This source table contains metadata about dbt exposures tracked
          by the Elementary data observability package. It stores information about
          dashboards, reports, and other downstream data consumers that depend on
          dbt models, including their configuration, dependencies, and ownership details.
          This table is primarily used for data lineage tracking and impact analysis
          to help data teams understand how changes to models might affect business-critical
          reports and dashboards.
