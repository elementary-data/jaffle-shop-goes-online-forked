version: 2

sources:
  - name: ads
    schema: "{{ target.schema }}"
    tables:
      - name: stg_google_ads
      - name: stg_facebook_ads
      - name: stg_instagram_ads

  - name: sessions
    schema: "{{ target.schema }}"
    tables:
