              arguments:
                compare_model: source('ads', 'stg_instagram_ads')
                include:
                  - ad_id
                  - cost
                  - date
                  - utm_campain
                  - utm_medium
              config:
                tags:
                  - data_contract
                severity: warn
  - name: sessions
    schema: "{{ target.schema }}"
    tables:
      - name: stg_website_sessions
        data_tests:
          - dbt_utils.equal_column_subset:
              arguments:
                compare_model: source('sessions', 'stg_website_sessions')
                include:
                  - ad_id
                  - customer_id
                  - ended_at
                  - session_id
                  - started_at
                  - utm_source
              config:
                tags:
