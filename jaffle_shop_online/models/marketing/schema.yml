version: 2

models:
  - name: ads_spend
    description: "This table contains the daily ad spend, by source, medium and campaign"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing", "finance", "finance-data-product"]
      elementary:
        timestamp_column: "day"
    columns:
      - name: day
        data_type: date
        description: "Day (UTC) of the ad spend"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

      - name: utm_medium
        data_type: varchar
        description: "The advertising or marketing medium. The medium can be social
          media, banners, CPC, third-party blogs, etc."

      - name: utm_campain
        data_type: varchar
        description: "The name of the advertising campaign"

      - name: spend
        data_type: number
        description: "The USD amount of money spent"

  - name: attribution_touches
    description: "This is a table that contains all the touch points, by session,
      with the utm_source, utm_medium and utm_campaign"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing", "pii", "finance-data-product"]
      elementary:
        timestamp_column: "converted_at"
    columns:
      - name: customer_id
        data_type: number
        description: "A unique identifier for a customer"

      - name: session_id
        data_type: varchar
        description: "A unique identifier for a session"

      - name: started_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session started"

      - name: ended_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session ended"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

      - name: utm_medium
        data_type: varchar
        description: "The advertising or marketing medium. The medium can be social
          media, banners, CPC, third-party blogs, etc."

      - name: utm_campain
        data_type: varchar
        description: "The name of the advertising campaign"

      - name: converted_at
        data_type: timestamp_ntz
        description: "The time of the conversion"

      - name: revenue
        data_type: number
        description: "Revenue amount (USD) of the conversion"

      - name: total_sessions
        data_type: number
        description: "Total number of sessions made by the customer"

      - name: session_index
        data_type: number
        description: "Index of the session"

      - name: first_touch_points
        data_type: number
        description: ""

      - name: last_touch_points
        data_type: number
        description: ""

      - name: forty_twenty_forty_points
        data_type: number
        description: ""

      - name: linear_points
        data_type: number
        description: ""

      - name: first_touch_revenue
        data_type: number
        description: "Revenue amount (USD) of the first touch point"

      - name: last_touch_revenue
        data_type: number
        description: "Revenue amount (USD) of the last touch point"

      - name: forty_twenty_forty_revenue
        data_type: number
        description: ""

      - name: linear_revenue
        data_type: number
        description: ""

  - name: cpa_and_roas
    description: "This table contains the cost per acquisition and return on ad spend,
      by source, and per day"
    meta:
      owner: "@finance-team"
    config:
      tags:
        - "finance"
        - "finance-data-product"
      elementary:
        timestamp_column: "day"
    columns:
      - name: day
        data_type: date
        description: "Day (UTC)"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

      - name: attribution_points
        data_type: number
        description: "Total number of attribution points"

      - name: attribution_revenue
        data_type: number
        description: "Total revenue amount (USD)"

      - name: total_spend
        data_type: number
        description: "Total spend amount (USD)"

      - name: cost_per_acquisition
        data_type: number
        description: "Cost (USD) per acquisition, calculated as total_spend / attribution_points"

      - name: return_on_advertising_spend
        data_type: number
        description: "The ROI of the ad spend, calculated as attribution_revenue /
          total_spend"
        data_tests:
          - elementary.column_anomalies:
              anomaly_direction: both
              anomaly_sensitivity: 2
              column_anomalies:
                - average
              detection_period:
                count: 2
                period: day
              timestamp_column: day
              training_period:
                count: 14
                period: day
              time_bucket:
                period: day
                count: 1

  - name: marketing_ads
    description: "This table contains information on the ad spend, by source, medium
      and campaign"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing", "finance"]
      elementary:
        timestamp_column: "date"
    columns:
      - name: ad_id
        data_type: varchar
        description: "Unique identifier for an ad"

      - name: date
        data_type: date
        description: "date (UTC) when the ad was displayed"

      - name: utm_medium
        data_type: varchar
        description: "The advertising or marketing medium. The medium can be social
          media, banners, CPC, third-party blogs, etc."

      - name: utm_campain
        data_type: varchar
        description: "The name of the advertising campaign"

      - name: cost
        data_type: number
        description: "Cost (USD) accumulated of the ad presentations so far"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

  - name: agg_sessions
    description: "This table contains aggregated information on the sessions"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing"]
      elementary:
        timestamp_column: "started_at"
    columns:
      - name: session_id
        data_type: varchar
        description: "Unique identifier for a session"

      - name: customer_id
        data_type: number
        description: "Unique identifier for a customer"

      - name: started_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session started"

      - name: ended_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session ended"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

      - name: ad_id
        data_type: varchar
        description: "Unique identifier for an ad"

      - name: platform
        data_type: varchar
        description: "Platform where the session was made. For example, website, iOS
          app, Android app, etc."

  - name: customer_conversions
    description: "This table contains information on the conversions of all the customers"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing", "finance", "pii"]
      elementary:
        timestamp_column: "converted_at"
    columns:
      - name: customer_id
        data_type: number
        description: "Unique identifier for a customer"

      - name: converted_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the conversion happened"

      - name: revenue
        data_type: number
        description: "Total revenue amount (USD) of the conversion"

  - name: sessions
    description: "This table contains information on the sessions of all the customers
      and the utm_source, utm_medium and utm_campaign of the session"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing", "pii"]
      elementary:
        timestamp_column: "started_at"
    columns:
      - name: session_id
        data_type: varchar
        description: "Unique identifier for a session"

      - name: customer_id
        data_type: number
        description: "Unique identifier for a customer"

      - name: started_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session started"

      - name: ended_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session ended"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

      - name: utm_medium
        data_type: varchar
        description: "The advertising or marketing medium. The medium can be social
          media, banners, CPC, third-party blogs, etc."

      - name: utm_campain
        data_type: varchar
        description: "The name of the advertising campaign"

  - name: campaign_roi
    description: "This table contains campaign-level ROI metrics including ROI, ROAS, CPA, and revenue per conversion, broken down by day, source, medium, and campaign. Supports multi-attribution model comparison."
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing", "finance", "finance-data-product"]
      elementary:
        timestamp_column: "day"
    columns:
      - name: day
        data_type: date
        description: "Day (UTC) of the campaign activity"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed (e.g. Google, Facebook, Twitter)"

      - name: utm_medium
        data_type: varchar
        description: "The advertising or marketing medium (e.g. social, banners, CPC)"

      - name: utm_campain
        data_type: varchar
        description: "The name of the advertising campaign"

      - name: total_spend
        data_type: number
        description: "Total spend amount (USD) for the campaign on this day"

      - name: unique_customers
        data_type: number
        description: "Number of unique customers attributed to this campaign"

      - name: total_conversions
        data_type: number
        description: "Total number of conversions (orders) attributed to this campaign"

      - name: attribution_points
        data_type: number
        description: "Total attribution points using linear attribution model"

      - name: attribution_revenue
        data_type: number
        description: "Total attributed revenue (USD) using linear attribution model"

      - name: roi
        data_type: number
        description: "Return on Investment, calculated as (attribution_revenue - total_spend) / total_spend"

      - name: roas
        data_type: number
        description: "Return on Advertising Spend, calculated as attribution_revenue / total_spend"

      - name: cost_per_acquisition
        data_type: number
        description: "Cost per acquisition (USD), calculated as total_spend / attribution_points"

      - name: revenue_per_conversion
        data_type: number
        description: "Average revenue per conversion (USD), calculated as attribution_revenue / total_conversions"

      - name: first_touch_revenue
        data_type: number
        description: "Attributed revenue (USD) using first-touch attribution model"

      - name: last_touch_revenue
        data_type: number
        description: "Attributed revenue (USD) using last-touch attribution model"

      - name: time_decay_revenue
        data_type: number
        description: "Attributed revenue (USD) using time-decay attribution model"