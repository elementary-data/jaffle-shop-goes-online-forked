version: 2

models:
  - name: ads_spend
    description: "This table contains the daily ad spend, by source, medium and campaign"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing", "finance", "finance-data-product"]
      elementary:
        timestamp_column: "day"
    columns:
      - name: day
        data_type: date
        description: "Day (UTC) of the ad spend"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

      - name: utm_medium
        data_type: varchar
        description: "The advertising or marketing medium. The medium can be social
          media, banners, CPC, third-party blogs, etc."

      - name: utm_campain
        data_type: varchar
        description: "The name of the advertising campaign"

      - name: spend
        data_type: number
        description: "The USD amount of money spent"

  - name: attribution_touches
    description: "This is a table that contains all the touch points, by session,
      with the utm_source, utm_medium and utm_campaign"
    meta:
      owner: "@finance-team"
    config:
      tags: ["marketing", "pii", "finance-data-product"]
      elementary:
        timestamp_column: "converted_at"
    columns:
      - name: customer_id
        data_type: number
        description: "A unique identifier for a customer"

      - name: session_id
        data_type: varchar
        description: "A unique identifier for a session"

      - name: started_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session started"

      - name: ended_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session ended"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

      - name: utm_medium
        data_type: varchar
        description: "The advertising or marketing medium. The medium can be social
          media, banners, CPC, third-party blogs, etc."

      - name: utm_campain
        data_type: varchar
        description: "The name of the advertising campaign"

      - name: converted_at
        data_type: timestamp_ntz
        description: "The time of the conversion"

      - name: revenue
        data_type: number
        description: "Revenue amount (USD) of the conversion"

      - name: total_sessions
        data_type: number
        description: "Total number of sessions made by the customer"

      - name: session_index
        data_type: number
        description: "Index of the session"

      - name: first_touch_points
        data_type: number
        description: ""

      - name: last_touch_points
        data_type: number
        description: ""

      - name: forty_twenty_forty_points
        data_type: number
        description: ""

      - name: linear_points
        data_type: number
        description: ""

      - name: first_touch_revenue
        data_type: number
        description: "Revenue amount (USD) of the first touch point"

      - name: last_touch_revenue
        data_type: number
        description: "Revenue amount (USD) of the last touch point"

      - name: forty_twenty_forty_revenue
        data_type: number
        description: ""

      - name: linear_revenue
        data_type: number
        description: ""

  - name: cpa_and_roas
    description: "This table contains the cost per acquisition and return on ad spend,
      by source, and per day"
    meta:
      owner: "@finance-team"
    config:
      tags:
        - "finance"
        - "finance-data-product"
        - "marketing"
      elementary:
        timestamp_column: "day"
    data_tests:
      # Business Logic Validation Tests
      - name: roas_range_validation
        test: dbt_utils.expression_is_true
        config:
          expression: "return_on_advertising_spend IS NULL OR (return_on_advertising_spend >= 0 AND return_on_advertising_spend <= 1000)"
          severity: error
        description: "Ensures ROAS values are within reasonable business bounds (0-1000%)"
      
      - name: cpa_positive_values_check
        test: dbt_utils.expression_is_true
        config:
          expression: "cost_per_acquisition IS NULL OR cost_per_acquisition > 0"
          severity: error
        description: "Validates that CPA is always positive when calculated"
      
      - name: spend_attribution_consistency
        test: dbt_utils.expression_is_true  
        config:
          expression: "NOT (total_spend > 0 AND attribution_points = 0 AND attribution_revenue = 0)"
          severity: warn
        description: "Verifies records with spend have corresponding attribution data"
    columns:
      - name: day
        data_type: date
        description: "Day (UTC)"
        data_tests:
          - not_null:
              config:
                severity: error
          - dbt_utils.not_accepted_values:
              values: ['1900-01-01', '2099-12-31']
              quote: false
              config:
                severity: warn

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."
        data_tests:
          - not_null:
              config:
                severity: error

      - name: attribution_points
        data_type: number
        description: "Total number of attribution points"
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              where: "attribution_points IS NOT NULL"
              config:
                severity: warn

      - name: attribution_revenue
        data_type: number
        description: "Total revenue amount (USD)"
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              where: "attribution_revenue IS NOT NULL"
              config:
                severity: warn

      - name: total_spend
        data_type: number
        description: "Total spend amount (USD)"
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              where: "total_spend IS NOT NULL"
              config:
                severity: warn

      - name: cost_per_acquisition
        data_type: number
        description: "Cost (USD) per acquisition, calculated as total_spend / attribution_points"
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
              where: "cost_per_acquisition IS NOT NULL"
              config:
                severity: error

      - name: return_on_advertising_spend
        data_type: number
        description: "The ROI of the ad spend, calculated as attribution_revenue /
          total_spend"
        data_tests:
          - elementary.column_anomalies:
              anomaly_direction: both
              anomaly_sensitivity: 1.5
              column_anomalies:
                - average
              detection_period:
                count: 2
                period: day
              timestamp_column: day
              training_period:
                count: 30
                period: day
              time_bucket:
                period: day
                count: 1
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1000
              inclusive: true
              where: "return_on_advertising_spend IS NOT NULL"
              config:
                severity: error

  - name: marketing_ads
    description: "This table contains information on the ad spend, by source, medium
      and campaign"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing", "finance"]
      elementary:
        timestamp_column: "date"
    columns:
      - name: ad_id
        data_type: varchar
        description: "Unique identifier for an ad"

      - name: date
        data_type: date
        description: "date (UTC) when the ad was displayed"

      - name: utm_medium
        data_type: varchar
        description: "The advertising or marketing medium. The medium can be social
          media, banners, CPC, third-party blogs, etc."

      - name: utm_campain
        data_type: varchar
        description: "The name of the advertising campaign"

      - name: cost
        data_type: number
        description: "Cost (USD) accumulated of the ad presentations so far"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

  - name: agg_sessions
    description: "This table contains aggregated information on the sessions"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing"]
      elementary:
        timestamp_column: "started_at"
    columns:
      - name: session_id
        data_type: varchar
        description: "Unique identifier for a session"

      - name: customer_id
        data_type: number
        description: "Unique identifier for a customer"

      - name: started_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session started"

      - name: ended_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session ended"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

      - name: ad_id
        data_type: varchar
        description: "Unique identifier for an ad"

      - name: platform
        data_type: varchar
        description: "Platform where the session was made. For example, website, iOS
          app, Android app, etc."

  - name: customer_conversions
    description: "This table contains information on the conversions of all the customers"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing", "finance", "pii"]
      elementary:
        timestamp_column: "converted_at"
    columns:
      - name: customer_id
        data_type: number
        description: "Unique identifier for a customer"

      - name: converted_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the conversion happened"

      - name: revenue
        data_type: number
        description: "Total revenue amount (USD) of the conversion"

  - name: sessions
    description: "This table contains information on the sessions of all the customers
      and the utm_source, utm_medium and utm_campaign of the session"
    meta:
      owner: "@marketing-team"
    config:
      tags: ["marketing", "pii"]
      elementary:
        timestamp_column: "started_at"
    columns:
      - name: session_id
        data_type: varchar
        description: "Unique identifier for a session"

      - name: customer_id
        data_type: number
        description: "Unique identifier for a customer"

      - name: started_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session started"

      - name: ended_at
        data_type: timestamp_ntz
        description: "Time (UTC) when the session ended"

      - name: utm_source
        data_type: varchar
        description: "Source where the ad was displayed. For example, Google, Facebook,
          Twitter, Newsletter, etc."

      - name: utm_medium
        data_type: varchar
        description: "The advertising or marketing medium. The medium can be social
          media, banners, CPC, third-party blogs, etc."

      - name: utm_campain
        data_type: varchar
        description: "The name of the advertising campaign"